name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'



      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android App
        run: |
          mkdir -p app/src/main/java/com/dutch/salam app/src/main/assets
          cp web/* app/src/main/assets/
          cp android/*.java app/src/main/java/com/dutch/salam/
          cp google-services.json app/google-services.json

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Dutch'
          include ':app'
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1'
              id 'com.google.gms.google-services' version '4.4.2'
          }
          android {
              namespace 'com.dutch.salam'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.dutch.salam'
                  minSdk 23
                  targetSdk 35
                  versionCode 6
                  versionName '1.5'
              }
          }
          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-messaging'
          }
          EOF

          printf '%s\n' 'android.useAndroidX=true' > gradle.properties

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="Dutch Learning"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="nastya_reminders"/>
                  <service android:name=".NastyaMessagingService" android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DutchLearning.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dutch-Learning-APK
          path: DutchLearning.apk
