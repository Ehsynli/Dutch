name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'



      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android App
        run: |
          mkdir -p app/src/main/java/com/dutch/salam app/src/main/assets
          cp web/index.html web/vocabulary.js web/practice.js web/reading.js app/src/main/assets/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Dutch'
          include ':app'
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1'
          }
          android {
              namespace 'com.dutch.salam'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.dutch.salam'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Dutch Learning"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dutch/salam/MainActivity.java <<'EOF'
          package com.dutch.salam;

          import android.app.Activity;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              @SuppressWarnings("deprecation")
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  View root = getWindow().getDecorView();
                  root.setOnApplyWindowInsetsListener((view, insets) -> {
                      view.setPadding(insets.getSystemWindowInsetLeft(), insets.getSystemWindowInsetTop(),
                          insets.getSystemWindowInsetRight(), insets.getSystemWindowInsetBottom());
                      return insets;
                  });
                  WebView web = new WebView(this);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.getSettings().setAllowFileAccess(false);
                  web.getSettings().setAllowContentAccess(false);
                  web.addJavascriptInterface(new ReadingPrinter(web), "AndroidReading");
                  setContentView(web);
                  root.requestApplyInsets();
                  web.loadUrl("file:///android_asset/index.html");
              }

              public final class ReadingPrinter {
                  private final WebView web;

                  ReadingPrinter(WebView web) {
                      this.web = web;
                  }

                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> {
                          PrintManager manager = getSystemService(PrintManager.class);
                          if (manager == null) return;
                          manager.print("Dutch Learning", web.createPrintDocumentAdapter("Dutch Learning"),
                              new PrintAttributes.Builder().setMediaSize(PrintAttributes.MediaSize.ISO_A4).build());
                      });
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DutchLearning.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dutch-Learning-APK
          path: DutchLearning.apk
